version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: grabfood_mini_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: grabfood_mini
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/db_setup/master/my.cnf:/etc/mysql/my.cnf
      - ./backend/db_setup/master/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword" ]
      timeout: 20s
      retries: 10

  db_replica:
    image: mysql:8.0
    container_name: grabfood_mini_db_replica
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: grabfood_mini
    volumes:
      - db_replica_data:/var/lib/mysql
      - ./backend/db_setup/slave/my.cnf:/etc/mysql/my.cnf
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grabfood_mini_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=grabfood_mini
      - CLIENT_URL=http://localhost:3000
      - AI_PROVIDER=${AI_PROVIDER}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - GROQ_MODEL=${GROQ_MODEL}
    volumes:
      - ./backend:/app
      - /app/node_modules
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grabfood_mini_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
  db_replica_data:
